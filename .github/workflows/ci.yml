name: Validate
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Validation and template checks commit to temporary repositories.
      GIT_AUTHOR_NAME: Workspace verification
      GIT_AUTHOR_EMAIL: verification@example.test
      GIT_COMMITTER_NAME: Workspace verification
      GIT_COMMITTER_EMAIL: verification@example.test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm app:prepare --all --include-templates --source default
      - run: pnpm validate
      - run: pnpm test:node-clone
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:templates
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            .cache/template-verification/project/test-results/
            .cache/template-verification/plain-next/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
