name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile
        type: choice
        required: true
        default: quick
        options:
          - quick
          - standard
          - full

jobs:
  validate:
    name: ${{ github.event_name == 'workflow_dispatch' && format('validate ({0})', inputs.profile) || 'validate' }}
    runs-on: ubuntu-latest
    env:
      VALIDATION_PROFILE: ${{ inputs.profile || 'standard' }}
      NEXT_TELEMETRY_DISABLED: '1'
      # Validation and template checks commit to temporary repositories.
      GIT_AUTHOR_NAME: Workspace verification
      GIT_AUTHOR_EMAIL: verification@example.test
      GIT_COMMITTER_NAME: Workspace verification
      GIT_COMMITTER_EMAIL: verification@example.test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.VALIDATION_PROFILE == 'standard' && '0' || '1' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.VALIDATION_PROFILE != 'full'
        run: pnpm check:workspace --source
      - if: env.VALIDATION_PROFILE != 'full'
        run: pnpm format:check
      - if: env.VALIDATION_PROFILE == 'standard'
        env:
          VALIDATION_BASE: ${{ github.event_name == 'workflow_dispatch' && 'HEAD^' || github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/standard.mjs
      - if: env.VALIDATION_PROFILE == 'full'
        run: pnpm app:prepare --all --include-templates --source default
      - if: env.VALIDATION_PROFILE == 'full'
        run: pnpm validate
      - if: env.VALIDATION_PROFILE == 'full'
        run: pnpm test:node-clone
      - if: env.VALIDATION_PROFILE == 'full'
        run: pnpm exec playwright install --with-deps chromium
      - if: env.VALIDATION_PROFILE == 'full'
        run: pnpm test:templates
      - uses: actions/upload-artifact@v7
        if: failure() && env.VALIDATION_PROFILE == 'full'
        with:
          name: browser-test-results
          path: |
            test-results/
            .cache/template-verification/project/test-results/
            .cache/template-verification/plain-next/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
